<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Glyph is kept inside the central 80% so it survives the circular/squircle crop
    an OS applies to a maskable PWA icon. The dark plate is load-bearing: a
    white-only glyph on transparency disappears in light-mode browser tabs.
  -->
  <rect width="512" height="512" rx="96" fill="#0b0e14"/>
  <g fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round">
    <circle cx="256" cy="256" r="130"/>
    <line x1="256" y1="256" x2="256" y2="168"/>
    <line x1="256" y1="256" x2="322" y2="282"/>
  </g>
  <circle cx="256" cy="256" r="17" fill="#ffffff"/>
</svg>
